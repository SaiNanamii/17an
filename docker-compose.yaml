services:
  # Postgres is NOT managed here. It already runs standalone on the VPS
  # (~/db/docker-compose.yaml, container lomba_postgres) with the 15M-row
  # dataset loaded and indexed — do not redefine or restart it from this
  # file. The backend below reaches it through the Docker host's published
  # port 5432 via `host.docker.internal` (extra_hosts, works on Linux with
  # Docker 20.10+ and on Docker Desktop).

  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: lomba_jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  backend:
    build:
      context: ./backend
    container_name: lomba_backend
    restart: unless-stopped
    depends_on:
      jaeger:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 3000
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-lomba}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env to match the running lomba_postgres container}
      DB_NAME: ${DB_NAME:-lomba_challenge}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-20}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
      DB_CONN_MAX_LIFETIME_MINUTES: ${DB_CONN_MAX_LIFETIME_MINUTES:-30}
      DB_CONN_MAX_IDLE_TIME_MINUTES: ${DB_CONN_MAX_IDLE_TIME_MINUTES:-5}
      OTEL_EXPORTER_OTLP_ENDPOINT: "jaeger:4318"
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
    container_name: lomba_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
