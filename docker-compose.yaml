  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: lomba_jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  backend:
    build:
      context: ./backend
    container_name: lomba_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-lomba}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-lomba}
      DB_NAME: ${POSTGRES_DB:-lomba_challenge}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-20}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
      DB_CONN_MAX_LIFETIME_MINUTES: ${DB_CONN_MAX_LIFETIME_MINUTES:-30}
      DB_CONN_MAX_IDLE_TIME_MINUTES: ${DB_CONN_MAX_IDLE_TIME_MINUTES:-5}
      OTEL_EXPORTER_OTLP_ENDPOINT: "jaeger:4318"
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
    container_name: lomba_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
