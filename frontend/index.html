<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>17AN // Customer Intelligence</title>
<style>
  :root {
    --paper: #f4f1ea;
    --ink: #111111;
    --yellow: #ffd400;
    --red: #ff3b30;
    --green: #00b86b;
    --blue: #1e5eff;
    --merah: #ce1126;
    --putih: #ffffff;
    --shadow: 6px 6px 0 var(--ink);
    --shadow-sm: 3px 3px 0 var(--ink);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --grotesk: "Archivo Narrow", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--grotesk);
    -webkit-font-smoothing: antialiased;
    background-image:
      linear-gradient(var(--ink) 1px, transparent 1px),
      linear-gradient(90deg, var(--ink) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: -1px -1px;
    background-attachment: fixed;
    background-color: var(--paper);
  }
  /* faint grid; keep it quiet under content panels */
  body { background-image:
      linear-gradient(rgba(17,17,17,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(17,17,17,.05) 1px, transparent 1px); }

  .flag-strip {
    display: flex; height: 8px;
  }
  .flag-strip > span { flex: 1; }
  .flag-strip > span:first-child { background: var(--merah); }
  .flag-strip > span:last-child { background: var(--putih); border-bottom: 2px solid var(--ink); }

  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; flex-wrap: wrap;
    padding: 1.1rem 1.5rem;
    background: var(--ink); color: var(--paper);
    border-bottom: 4px solid var(--ink);
  }
  .hut-badge {
    display: flex; align-items: center; gap: .5rem;
    background: var(--merah); border: 2px solid var(--putih);
    padding: .3rem .6rem .3rem .5rem;
  }
  .hut-badge .num {
    font-family: var(--mono); font-weight: 800; font-size: 1.15rem; line-height: 1;
    color: var(--putih); background: var(--ink); padding: .15rem .35rem;
    border: 2px solid var(--putih);
  }
  .hut-badge .txt {
    font-family: var(--grotesk); font-weight: 800; font-size: .68rem; line-height: 1.15;
    color: var(--putih); text-transform: uppercase; letter-spacing: .03em;
  }
  header .brand { display: flex; align-items: baseline; gap: .6rem; }
  header .brand .mark {
    background: var(--yellow); color: var(--ink);
    font-family: var(--mono); font-weight: 800; font-size: .75rem;
    padding: .2rem .4rem; border: 2px solid var(--paper);
  }
  header h1 {
    font-size: 1.15rem; margin: 0; font-weight: 800; letter-spacing: .01em;
    text-transform: uppercase;
  }
  #health-badge {
    font-family: var(--mono); font-size: .78rem; font-weight: 700;
    padding: .35rem .65rem; border: 2px solid var(--paper);
    display: flex; align-items: center; gap: .5rem; background: var(--ink);
  }
  .dot { width: .6rem; height: .6rem; background: #666; flex: none; }
  .dot.ok { background: var(--green); }
  .dot.bad { background: var(--red); }

  nav {
    display: flex; gap: 0; border-bottom: 4px solid var(--ink);
    overflow-x: auto; background: var(--paper);
  }
  nav button {
    background: var(--paper); border: none; border-right: 3px solid var(--ink);
    color: var(--ink); padding: .85rem 1.2rem; cursor: pointer;
    font-size: .85rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em;
    white-space: nowrap; font-family: var(--grotesk);
  }
  nav button:hover { background: #e9e5da; }
  nav button.active { background: var(--yellow); }

  main { padding: 1.5rem; max-width: 1140px; margin: 0 auto; }
  section { display: none; }
  section.active { display: block; }

  .panel {
    background: #fff; border: 3px solid var(--ink); box-shadow: var(--shadow);
    padding: 1.4rem; margin-bottom: 1.6rem;
  }
  .row { display: flex; gap: .7rem; flex-wrap: wrap; align-items: center; }

  input, select {
    background: var(--paper); border: 3px solid var(--ink); color: var(--ink);
    padding: .6rem .75rem; font-size: .9rem; font-family: var(--grotesk);
    font-weight: 600;
  }
  input::placeholder { color: #777; font-weight: 500; }
  input { flex: 1; min-width: 200px; }
  input:focus, select:focus { outline: 3px solid var(--blue); outline-offset: 1px; }

  button.action, button.secondary {
    border: 3px solid var(--ink); padding: .6rem 1.1rem; cursor: pointer;
    font-weight: 800; font-size: .85rem; text-transform: uppercase; letter-spacing: .03em;
    font-family: var(--grotesk); box-shadow: var(--shadow-sm);
    transition: transform .06s ease, box-shadow .06s ease;
  }
  button.action { background: var(--yellow); color: var(--ink); }
  button.secondary { background: #fff; color: var(--ink); }
  button.action:active, button.secondary:active {
    transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink);
  }
  button.action:disabled, button.secondary:disabled {
    opacity: .4; cursor: default; box-shadow: none; transform: none;
  }

  table { width: 100%; border-collapse: collapse; margin-top: 1.1rem; font-size: .85rem; }
  th, td {
    text-align: left; padding: .55rem .65rem; border-bottom: 2px solid var(--ink);
    white-space: nowrap;
  }
  thead th {
    background: var(--ink); color: var(--paper); font-weight: 800;
    text-transform: uppercase; letter-spacing: .03em; font-size: .72rem;
    border-bottom: 3px solid var(--ink);
  }
  tbody tr:hover { background: #fff7d1; }
  td.mono, th.mono { font-family: var(--mono); }
  td.mono { font-family: var(--mono); font-size: .82rem; }

  .tag {
    display: inline-block; font-family: var(--mono); font-size: .68rem; font-weight: 800;
    padding: .15rem .4rem; border: 2px solid var(--ink); text-transform: uppercase;
    background: var(--paper);
  }
  .tag-missing { background: #eee; color: #888; border-color: #bbb; }
  .tag-high { background: var(--red); color: #fff; }
  .tag-medium { background: var(--yellow); color: var(--ink); }
  .tag-low { background: #ddd; color: var(--ink); }

  .meta { font-family: var(--mono); font-size: .78rem; margin-top: .6rem; color: #333; }
  .error {
    font-family: var(--mono); font-size: .82rem; margin-top: .7rem; padding: .6rem .8rem;
    background: var(--red); color: #fff; border: 2px solid var(--ink); display: none;
  }
  .loading {
    font-family: var(--mono); font-size: .8rem; margin-top: .7rem; color: var(--ink);
    display: none;
  }
  .loading::before { content: "> "; font-weight: 800; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1rem; }
  .card {
    background: var(--paper); border: 3px solid var(--ink); box-shadow: var(--shadow-sm);
    padding: 1.1rem;
  }
  .card h3 {
    margin: 0 0 .6rem; font-size: .75rem; font-weight: 800; text-transform: uppercase;
    letter-spacing: .05em; display: flex; align-items: center; gap: .4rem;
  }
  .card h3::before { content: ""; width: .55rem; height: .55rem; background: var(--ink); display: inline-block; }
  .card .big { font-size: 2rem; font-weight: 800; font-family: var(--mono); line-height: 1; }
  .card .meta { margin-top: .7rem; line-height: 1.5; }
  .bar { height: 10px; background: #fff; border: 2px solid var(--ink); margin-top: .7rem; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--ink); }

  /* ---- Charts (inline SVG, no external library) ---- */
  .chart-row { display: flex; gap: 1.2rem; align-items: center; flex-wrap: wrap; }
  .donut-wrap { display: flex; align-items: center; gap: 1rem; flex: none; }
  .donut-wrap .donut-label { font-family: var(--mono); }
  .donut-wrap .donut-label .big { font-size: 2.2rem; font-weight: 800; line-height: 1; }
  .donut-wrap .donut-label .sub { font-size: .72rem; color: #555; text-transform: uppercase; letter-spacing: .04em; margin-top: .25rem; }

  .barchart { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: .5rem; }
  .barchart .bc-row { display: grid; grid-template-columns: 110px 1fr 70px; align-items: center; gap: .6rem; }
  .barchart .bc-label { font-family: var(--mono); font-size: .75rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .barchart .bc-track { height: 16px; background: #fff; border: 2px solid var(--ink); overflow: hidden; }
  .barchart .bc-fill { display: block; height: 100%; }
  .barchart .bc-val { font-family: var(--mono); font-size: .75rem; font-weight: 700; text-align: right; }

  footer {
    border-top: 4px solid var(--ink); padding: .9rem 1.5rem; font-family: var(--mono);
    font-size: .72rem; color: #555; display: flex; justify-content: space-between; flex-wrap: wrap; gap: .5rem;
  }

  @media (max-width: 640px) {
    header, main { padding: 1rem; }
    header h1 { font-size: 1rem; }
    .panel { padding: 1rem; box-shadow: 4px 4px 0 var(--ink); }
    th, td { white-space: normal; }
  }
</style>
</head>
<body>

<div class="flag-strip"><span></span><span></span></div>
<header>
  <div class="brand">
    <span class="mark">17AN</span>
    <h1>Customer Intelligence</h1>
  </div>
  <div class="row" style="gap:.7rem;">
    <div class="hut-badge" title="Dirgahayu Republik Indonesia ke-81">
      <span class="num">81</span>
      <span class="txt">HUT&nbsp;RI<br>1945&ndash;2026</span>
    </div>
    <div id="health-badge"><span class="dot"></span><span id="health-text">CHECKING&hellip;</span></div>
  </div>
</header>

<nav>
  <button data-tab="search" class="active">01 · Search</button>
  <button data-tab="quality">02 · Data Quality</button>
  <button data-tab="duplicates">03 · Duplicates</button>
  <button data-tab="profile">04 · User Profile</button>
</nav>

<main>

  <!-- Round 2: Search -->
  <section id="tab-search" class="active">
    <div class="panel">
      <div class="row">
        <input id="search-q" placeholder="cari email / phone / user_id / nama..." />
        <select id="search-type">
          <option value="name">Nama (fuzzy)</option>
          <option value="email">Email (exact)</option>
          <option value="phone">Phone (exact)</option>
          <option value="user_id">User ID (exact)</option>
        </select>
        <button class="action" id="search-btn">Cari &rarr;</button>
      </div>
      <div class="meta" id="search-meta"></div>
      <div class="loading" id="search-loading">mencari...</div>
      <div class="error" id="search-error"></div>
      <div style="overflow-x:auto;">
        <table id="search-table" style="display:none;">
          <thead>
            <tr><th>User ID</th><th>Nama</th><th>Email</th><th>Phone</th><th>Status</th><th>Dibuat</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="row" id="search-pagination" style="display:none; margin-top:.9rem;">
        <button class="secondary" id="search-prev">&larr; Prev</button>
        <span class="meta" id="search-page-label"></span>
        <button class="secondary" id="search-next">Next &rarr;</button>
      </div>
    </div>
  </section>

  <!-- Round 3: Data Quality -->
  <section id="tab-quality">
    <div class="panel">
      <div class="row">
        <button class="action" id="quality-refresh">Refresh Report</button>
        <span class="meta" id="quality-meta"></span>
      </div>
      <div class="loading" id="quality-loading">menghitung...</div>
      <div class="error" id="quality-error"></div>
      <div id="quality-cards" class="grid" style="margin-top:1.1rem;"></div>
      <div style="overflow-x:auto;">
        <table id="quality-issues" style="display:none; margin-top:1.6rem;">
          <thead><tr><th>Field</th><th>Issue</th><th>Count</th><th>Severity</th><th>Contoh</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- Round 4: Duplicates -->
  <section id="tab-duplicates">
    <div class="panel">
      <div class="row">
        <button class="action" id="dup-ip-btn">Duplikat via IP</button>
        <button class="secondary" id="dup-exact-btn">Duplikat Email/Phone Exact</button>
      </div>
      <div class="loading" id="dup-loading">mencari duplikat...</div>
      <div class="error" id="dup-error"></div>
      <div class="meta" id="dup-meta"></div>
      <div style="overflow-x:auto;">
        <table id="dup-table" style="display:none;">
          <thead><tr id="dup-thead"></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- Round 5: User Profile (4-table join) -->
  <section id="tab-profile">
    <div class="panel">
      <div class="row">
        <input id="profile-id" placeholder="user_id, misal: 18217221" />
        <button class="action" id="profile-btn">Lihat Profile &rarr;</button>
      </div>
      <div class="loading" id="profile-loading">memuat...</div>
      <div class="error" id="profile-error"></div>
      <div id="profile-cards" class="grid" style="margin-top:1.1rem;"></div>
    </div>
  </section>

</main>

<footer>
  <span id="api-base-label"></span>
  <span>15M records · postgres · fiber+gorm · Dirgahayu Indonesia ke-81 🇮🇩</span>
</footer>
<div class="flag-strip"><span></span><span></span></div>

<script>
const API_BASE = `${location.protocol}//${location.hostname}:3000`;
document.getElementById('api-base-label').textContent = `API ${API_BASE}`;

function fmtMs(ms) { return ms == null ? '-' : `${ms} ms`; }
function fmtNum(n) { return n == null ? '-' : Number(n).toLocaleString('id-ID'); }
function fmtDate(s) { return s ? new Date(s).toLocaleString('id-ID') : '-'; }
function esc(s) { return s == null ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function missingTag() { return '<span class="tag tag-missing">missing</span>'; }

async function apiFetch(path, opts) {
  const res = await fetch(`${API_BASE}${path}`, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
  return body;
}

function showError(el, msg) { el.textContent = msg; el.style.display = 'block'; }
function hideError(el) { el.style.display = 'none'; }

// ---- Charts (inline SVG / CSS bars, zero dependencies) ----
function donutChart(pct, bigText, subText, color) {
  const size = 116, stroke = 16, r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const clamped = Math.max(0, Math.min(100, pct));
  const dash = (clamped / 100) * c;
  return `
    <div class="donut-wrap">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#e5e1d6" stroke-width="${stroke}"/>
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
          stroke-dasharray="${dash} ${c - dash}" stroke-linecap="butt"
          transform="rotate(-90 ${size/2} ${size/2})"/>
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#111" stroke-width="2"/>
      </svg>
      <div class="donut-label">
        <div class="big">${clamped.toFixed(1)}%</div>
        <div class="sub">${esc(bigText)}</div>
        ${subText ? `<div class="sub">${esc(subText)}</div>` : ''}
      </div>
    </div>`;
}

function barChart(items) {
  const max = Math.max(1, ...items.map(i => i.value));
  return `<div class="barchart">` + items.map(i => {
    const pct = Math.max(0, Math.min(100, (i.value / max) * 100));
    return `<div class="bc-row">
      <div class="bc-label">${esc(i.label)}</div>
      <div class="bc-track"><span class="bc-fill" style="width:${pct}%; background:${i.color || 'var(--ink)'}"></span></div>
      <div class="bc-val">${fmtNum(i.value)}</div>
    </div>`;
  }).join('') + `</div>`;
}

// ---- Tabs ----
document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('main section').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
  });
});

// ---- Health ----
async function checkHealth() {
  const dot = document.querySelector('#health-badge .dot');
  const text = document.getElementById('health-text');
  try {
    const h = await apiFetch('/api/health');
    dot.className = 'dot ok';
    text.textContent = `${h.status.toUpperCase()} · ${fmtNum(h.total_records)} USERS`;
  } catch (e) {
    dot.className = 'dot bad';
    text.textContent = 'API DISCONNECTED';
  }
}
checkHealth();
setInterval(checkHealth, 30000);

// ---- Round 2: Search ----
let searchOffset = 0;
const SEARCH_LIMIT = 10;

async function runSearch(resetOffset) {
  if (resetOffset) searchOffset = 0;
  const q = document.getElementById('search-q').value.trim();
  const type = document.getElementById('search-type').value;
  const errEl = document.getElementById('search-error');
  const loadingEl = document.getElementById('search-loading');
  const tableEl = document.getElementById('search-table');
  const metaEl = document.getElementById('search-meta');
  const pagEl = document.getElementById('search-pagination');
  hideError(errEl);
  tableEl.style.display = 'none';
  pagEl.style.display = 'none';
  if (!q) { showError(errEl, 'Masukkan kata kunci pencarian.'); return; }

  loadingEl.style.display = 'block';
  try {
    const data = await apiFetch(`/api/search?q=${encodeURIComponent(q)}&type=${type}&limit=${SEARCH_LIMIT}&offset=${searchOffset}`);
    const tbody = tableEl.querySelector('tbody');
    tbody.innerHTML = '';
    if (!data.results || data.results.length === 0) {
      metaEl.textContent = `tidak ada hasil untuk "${q}"`;
    } else {
      for (const r of data.results) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="mono">${esc(r.user_id)}</td>
          <td>${esc(r.full_name) || '-'}</td>
          <td>${esc(r.user_email) || missingTag()}</td>
          <td>${esc(r.msisdn) || missingTag()}</td>
          <td>${esc(r.status)}</td>
          <td class="mono">${fmtDate(r.created_at)}</td>`;
        tbody.appendChild(tr);
      }
      tableEl.style.display = 'table';
      pagEl.style.display = 'flex';
      document.getElementById('search-page-label').textContent =
        `${searchOffset + 1}-${searchOffset + data.results.length} / ${fmtNum(data.total)}`;
      document.getElementById('search-prev').disabled = searchOffset === 0;
      document.getElementById('search-next').disabled = searchOffset + SEARCH_LIMIT >= data.total;
    }
    metaEl.textContent = `${fmtNum(data.total)} hasil · ${fmtMs(data.took_ms)}`;
  } catch (e) {
    showError(errEl, e.message);
  } finally {
    loadingEl.style.display = 'none';
  }
}
document.getElementById('search-btn').addEventListener('click', () => runSearch(true));
document.getElementById('search-q').addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(true); });
document.getElementById('search-prev').addEventListener('click', () => { searchOffset = Math.max(0, searchOffset - SEARCH_LIMIT); runSearch(false); });
document.getElementById('search-next').addEventListener('click', () => { searchOffset += SEARCH_LIMIT; runSearch(false); });

// ---- Round 3: Data Quality ----
function qualityCard(title, presentPct, lines) {
  const div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = `<h3>${esc(title)}</h3><div class="big">${presentPct}</div>
    <div class="bar"><span style="width:${Math.max(0, Math.min(100, parseFloat(presentPct)))}%"></span></div>
    <div class="meta">${lines.join('<br>')}</div>`;
  return div;
}

async function loadQuality() {
  const loadingEl = document.getElementById('quality-loading');
  const errEl = document.getElementById('quality-error');
  const cardsEl = document.getElementById('quality-cards');
  const issuesEl = document.getElementById('quality-issues');
  const metaEl = document.getElementById('quality-meta');
  hideError(errEl);
  loadingEl.style.display = 'block';
  cardsEl.innerHTML = '';
  issuesEl.style.display = 'none';
  try {
    const [data, metrics] = await Promise.all([apiFetch('/api/quality'), apiFetch('/api/metrics')]);
    const m = data.quality_metrics;
    metaEl.textContent = `${fmtNum(data.total_records)} records · dianalisis ${fmtDate(data.analyzed_at)}`;

    const existingOverview = document.querySelector('[data-quality-overview]');
    if (existingOverview) existingOverview.remove();
    const overviewPanel = document.createElement('div');
    overviewPanel.className = 'panel';
    overviewPanel.style.padding = '1.1rem';
    overviewPanel.dataset.qualityOverview = '1';
    overviewPanel.innerHTML = `<div class="chart-row">
        ${donutChart(metrics.quality_score, 'Quality Score', `${fmtNum(metrics.missing_fields)} field kosong`, 'var(--green)')}
        ${barChart([
          { label: 'Email', value: m.email.present, color: 'var(--blue)' },
          { label: 'Phone', value: m.phone.present, color: 'var(--blue)' },
          { label: 'Birth Date', value: m.birth_date.present, color: 'var(--blue)' },
          { label: 'Hobbies', value: data.total_records - m.hobbies.null_count, color: 'var(--blue)' },
        ])}
      </div>`;
    document.getElementById('tab-quality').querySelector('.panel').before(overviewPanel);

    cardsEl.appendChild(qualityCard('Email', `${(100 - m.email.missing_percent).toFixed(1)}%`, [
      `${fmtNum(m.email.present)} terisi, ${fmtNum(m.email.missing_count)} kosong (${m.email.missing_percent}%)`,
      `${fmtNum(m.email.duplicate_count)} duplikat · ${fmtNum(m.email.invalid_format)} format salah`,
    ]));
    cardsEl.appendChild(qualityCard('Phone', `${(100 - m.phone.missing_percent).toFixed(1)}%`, [
      `${fmtNum(m.phone.present)} terisi, ${fmtNum(m.phone.missing_count)} kosong (${m.phone.missing_percent}%)`,
      `${fmtNum(m.phone.duplicate_count)} duplikat · ${fmtNum(m.phone.malformed)} malformed`,
    ]));
    cardsEl.appendChild(qualityCard('Birth Date', `${(100 - m.birth_date.missing_percent).toFixed(1)}%`, [
      `${fmtNum(m.birth_date.present)} terisi, ${fmtNum(m.birth_date.missing_count)} kosong (${m.birth_date.missing_percent}%)`,
      `${fmtNum(m.birth_date.impossible_dates)} impossible · ${fmtNum(m.birth_date.future_dates)} tanggal masa depan`,
    ]));
    cardsEl.appendChild(qualityCard('Hobbies', `${(100 - m.hobbies.null_percent).toFixed(1)}%`, [
      `${fmtNum(m.hobbies.null_count)} NULL (${m.hobbies.null_percent}%)`,
      `${fmtNum(m.hobbies.with_emoji)} mengandung emoji/karakter spesial`,
    ]));
    const statusDiv = document.createElement('div');
    statusDiv.className = 'card';
    const statusEntries = Object.entries(m.status.distribution);
    statusDiv.innerHTML = `<h3>Status Distribution</h3>` + barChart(
      statusEntries.map(([k, v]) => ({
        label: k === '-1' ? 'Unverified' : k === '0' ? 'Inactive' : 'Active',
        value: v,
        color: k === '-1' ? 'var(--yellow)' : k === '0' ? '#bbb' : 'var(--green)',
      }))
    );
    cardsEl.appendChild(statusDiv);

    const tbody = issuesEl.querySelector('tbody');
    tbody.innerHTML = '';
    for (const issue of (data.data_issues || [])) {
      const tr = document.createElement('tr');
      const tagClass = issue.severity === 'high' ? 'tag-high' : issue.severity === 'medium' ? 'tag-medium' : 'tag-low';
      tr.innerHTML = `<td>${esc(issue.field)}</td><td>${esc(issue.issue_type)}</td><td class="mono">${fmtNum(issue.count)}</td>
        <td><span class="tag ${tagClass}">${esc(issue.severity)}</span></td><td class="mono">${(issue.examples || []).map(esc).join(', ')}</td>`;
      tbody.appendChild(tr);
    }
    if (data.data_issues && data.data_issues.length) issuesEl.style.display = 'table';
  } catch (e) {
    showError(errEl, e.message);
  } finally {
    loadingEl.style.display = 'none';
  }
}
document.getElementById('quality-refresh').addEventListener('click', loadQuality);

// ---- Round 4: Duplicates ----
async function loadDuplicatesByIP() {
  const loadingEl = document.getElementById('dup-loading');
  const errEl = document.getElementById('dup-error');
  const tableEl = document.getElementById('dup-table');
  const metaEl = document.getElementById('dup-meta');
  hideError(errEl); tableEl.style.display = 'none';
  loadingEl.style.display = 'block';
  try {
    const data = await apiFetch('/api/duplicates/find?method=ip_address&limit=20');
    document.getElementById('dup-thead').innerHTML =
      '<th>IP Address</th><th>Jumlah User</th><th>User IDs</th><th>Aktivitas Pertama</th><th>Aktivitas Terakhir</th><th>Confidence</th>';
    const tbody = tableEl.querySelector('tbody');
    tbody.innerHTML = '';
    for (const g of data.duplicate_groups) {
      const tr = document.createElement('tr');
      const ids = (g.user_ids || []).slice(0, 6).join(', ') + (g.user_ids.length > 6 ? ', ...' : '');
      tr.innerHTML = `<td class="mono">${esc(g.shared_attribute)}</td><td class="mono">${fmtNum(g.user_count)}</td>
        <td class="mono">${esc(ids)}</td><td class="mono">${fmtDate(g.first_activity)}</td><td class="mono">${fmtDate(g.last_activity)}</td>
        <td><span class="tag tag-high">${esc(g.confidence)}</span></td>`;
      tbody.appendChild(tr);
    }
    metaEl.textContent = `${fmtNum(data.total_groups_found)} grup ditemukan · ${fmtNum(data.total_duplicate_users)} user terlibat`;
    tableEl.style.display = 'table';

    const existingChart = document.querySelector('[data-dup-chart]');
    if (existingChart) existingChart.remove();
    if (data.duplicate_groups && data.duplicate_groups.length) {
      const top = data.duplicate_groups.slice(0, 8);
      const chartDiv = document.createElement('div');
      chartDiv.dataset.dupChart = '1';
      chartDiv.style.marginTop = '1.2rem';
      chartDiv.innerHTML = `<div class="meta" style="margin-bottom:.3rem;">Top ${top.length} grup terbesar (per IP)</div>` +
        barChart(top.map(g => ({ label: g.shared_attribute, value: g.user_count, color: 'var(--red)' })));
      tableEl.parentElement.after(chartDiv);
    }
  } catch (e) {
    showError(errEl, e.message);
  } finally {
    loadingEl.style.display = 'none';
  }
}

async function loadDuplicatesExact() {
  const existingChart = document.querySelector('[data-dup-chart]');
  if (existingChart) existingChart.remove();
  const loadingEl = document.getElementById('dup-loading');
  const errEl = document.getElementById('dup-error');
  const tableEl = document.getElementById('dup-table');
  const metaEl = document.getElementById('dup-meta');
  hideError(errEl); tableEl.style.display = 'none';
  loadingEl.style.display = 'block';
  try {
    const data = await apiFetch('/api/duplicates', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ limit: 50 }),
    });
    document.getElementById('dup-thead').innerHTML = '<th>User ID 1</th><th>User ID 2</th><th>Match Type</th><th>Similarity</th>';
    const tbody = tableEl.querySelector('tbody');
    tbody.innerHTML = '';
    for (const d of data.duplicates) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td class="mono">${esc(d.id1)}</td><td class="mono">${esc(d.id2)}</td><td>${esc(d.match_type)}</td><td class="mono">${esc(d.similarity)}</td>`;
      tbody.appendChild(tr);
    }
    metaEl.textContent = `${fmtNum(data.count)} pasangan duplikat (exact email/phone match)`;
    tableEl.style.display = 'table';
  } catch (e) {
    showError(errEl, e.message);
  } finally {
    loadingEl.style.display = 'none';
  }
}
document.getElementById('dup-ip-btn').addEventListener('click', loadDuplicatesByIP);
document.getElementById('dup-exact-btn').addEventListener('click', loadDuplicatesExact);

// ---- Round 5: User Profile ----
async function loadProfile() {
  const id = document.getElementById('profile-id').value.trim();
  const loadingEl = document.getElementById('profile-loading');
  const errEl = document.getElementById('profile-error');
  const cardsEl = document.getElementById('profile-cards');
  hideError(errEl); cardsEl.innerHTML = '';
  if (!id) { showError(errEl, 'Masukkan user_id.'); return; }
  if (!/^\d+$/.test(id)) { showError(errEl, 'user_id harus berupa angka, contoh: 53462510.'); return; }
  loadingEl.style.display = 'block';
  try {
    const p = await apiFetch(`/api/user-profile/${encodeURIComponent(id)}`);
    const card = (title, big, sub) => {
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `<h3>${esc(title)}</h3><div class="big">${big}</div><div class="meta">${sub}</div>`;
      return div;
    };
    cardsEl.appendChild(card('Profil', esc(p.full_name) || '-', `ID: ${esc(p.user_id)}<br>${esc(p.user_email) || 'no email'}<br>${esc(p.msisdn) || 'no phone'}`));
    cardsEl.appendChild(card('Orders', fmtNum(p.order_count), 'Total order dari user ini'));
    cardsEl.appendChild(card('Total Transaksi', `Rp ${fmtNum(p.total_transaction_amount)}`, 'Akumulasi seluruh transaksi'));
    cardsEl.appendChild(card('Aktivitas', fmtNum(p.activity_count), `Terakhir: ${fmtDate(p.last_activity)}`));
  } catch (e) {
    showError(errEl, e.message);
  } finally {
    loadingEl.style.display = 'none';
  }
}
document.getElementById('profile-btn').addEventListener('click', loadProfile);
document.getElementById('profile-id').addEventListener('keydown', e => { if (e.key === 'Enter') loadProfile(); });
</script>
</body>
